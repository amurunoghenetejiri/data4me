<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gradientMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1dd1a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d2d3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Dark background -->
  <rect width="512" height="512" fill="#000d1a"/>
  
  <!-- Main D4 Logo - Centered and large -->
  <g transform="translate(256, 256)">
    <!-- D Character with speed effect -->
    <g transform="translate(-80, 0)">
      <!-- D outline -->
      <path d="M -40,-80 L 0,-80 Q 80,-80 80,0 Q 80,80 0,80 L -40,80 Z" 
            fill="none" stroke="url(#gradientMain)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Speed lines on D -->
      <line x1="-60" y1="-60" x2="-5" y2="-60" stroke="url(#gradientMain)" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
      <line x1="-70" y1="-15" x2="10" y2="-15" stroke="url(#gradientMain)" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
      <line x1="-60" y1="30" x2="-5" y2="30" stroke="url(#gradientMain)" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
      <line x1="-55" y1="75" x2="5" y2="75" stroke="url(#gradientMain)" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
    </g>
    
    <!-- Number 4 -->
    <g transform="translate(70, 0)">
      <path d="M 10,-80 L 80,80 M 80,80 L 80,-20 M -30,35 L 100,35" 
            fill="none" stroke="url(#gradientMain)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>